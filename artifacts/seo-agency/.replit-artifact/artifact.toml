kind = "web"
previewPath = "/"
title = "SEO Agency Website"
version = "1.0.0"
id = "artifacts/seo-agency"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19823

[services.development]
run = "pnpm --filter @workspace/seo-agency run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seo-agency", "run", "build" ]
serve = "static"
publicDir = "artifacts/seo-agency/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19823"
BASE_PATH = "/"
